<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#10283e">
  <title>今日の天気 | 天気ボイス</title>
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="apple-touch-icon" href="./icon-192.png">
  <link rel="stylesheet" href="./style.css">
  <script src="./forecast.js" defer></script>
  <script src="./app.js" defer></script>
</head>
<body>
  <main>
    <header><img src="./icon-192.png" width="44" height="44" alt=""><h1>天気ボイス</h1></header>
    <form id="location">
      <div><label for="city">地点</label>
        <select id="city"></select>
      </div>
      <button type="submit">天気を更新</button>
    </form>
    <p id="status" role="status"></p>
    <section class="forecast" aria-labelledby="heading">
      <p id="date">今日の天気</p>
      <h2 id="heading">天気情報なし</h2>
      <dl>
        <div><dt>最高気温</dt><dd id="high">—</dd></div>
        <div><dt>最低気温</dt><dd id="low">—</dd></div>
        <div><dt>最大降水確率</dt><dd id="rain">—</dd></div>
      </dl>
      <p id="timestamp" hidden></p>
    </section>
    <section class="voice" aria-labelledby="voice-heading">
      <h2 id="voice-heading">音声読み上げ</h2>
      <p id="speech-text">天気を取得すると読み上げ文が表示されます。</p>
      <button id="speak" disabled>ずんだもんの天気予報を聞く</button>
      <button id="stop" disabled>停止</button>
      <p id="speech-status" role="status" hidden></p>
    </section>
    <footer>VOICEVOX:ずんだもん<br><a href="https://open-meteo.com/">天気データ：Open-Meteo</a></footer>
  </main>
</body>
</html>
