<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#2454a0">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="apple-touch-icon" href="./icon-192.png">
  <title>カウンター</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      grid-template-columns: minmax(0, 1fr);
      place-items: center;
      padding: 1rem;
      background: #eef2f8;
      color: #14243b;
      font-family: system-ui, sans-serif;
    }
    main {
      width: min(100%, 24rem);
      padding: 1.5rem;
      border-radius: 1.25rem;
      background: #fff;
      box-shadow: 0 12px 36px #14243b19;
      text-align: center;
    }
    h1 { margin: 0; font-size: 1.25rem; }
    output {
      display: block;
      margin: 1rem 0;
      font-size: clamp(3rem, 15vw, 5rem);
      font-weight: 700;
      font-variant-numeric: tabular-nums;
      overflow-wrap: anywhere;
    }
    .controls {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: .75rem;
    }
    button {
      min-height: 3.5rem;
      border: 0;
      border-radius: .75rem;
      background: #e7eef8;
      color: inherit;
      font: inherit;
      font-weight: 700;
      cursor: pointer;
    }
    button:focus-visible { outline: 3px solid #2454a0; outline-offset: 3px; }
    #increment { background: #2454a0; color: #fff; }
    #reset { grid-column: 1 / -1; background: #f0f2f5; }
    @media (max-width: 430px) {
      main { padding: 1.25rem 1rem; }
      .controls { gap: 1rem; }
      button { min-height: 4rem; }
      #decrement, #increment { font-size: 1.5rem; }
    }
  </style>
</head>
<body>
  <main>
    <h1>カウンター</h1>
    <p>ボタンを押して数を増減できます。</p>
    <output id="count" aria-label="カウント">0</output>
    <div class="controls">
      <button type="button" id="decrement">－1</button>
      <button type="button" id="increment">＋1</button>
      <button type="button" id="reset">リセット</button>
    </div>
  </main>
  <script>
    const countDisplay = document.querySelector('#count');
    let count = 0;

    function setCount(value) {
      count = value;
      countDisplay.value = String(count);
    }

    document.querySelector('#increment').addEventListener('click', () => setCount(count + 1));
    document.querySelector('#decrement').addEventListener('click', () => setCount(count - 1));
    document.querySelector('#reset').addEventListener('click', () => setCount(0));
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('./service-worker.js', { scope: './' })
        .catch((error) => console.warn('オフライン機能を有効にできませんでした。', error));
    }
  </script>
</body>
</html>
